# ============================================================
# CONFIGURACIÓN DEL BOT DE AUTOMATIZACIÓN
# Copia este archivo como "config.yaml" y rellena tus datos.
# NUNCA subas config.yaml a un repositorio público (contiene credenciales).
# ============================================================

email:
  # Datos de la cuenta de correo (IMAP para leer, SMTP para enviar el resumen)
  imap_server: "imap.gmail.com"
  imap_port: 993
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  address: "tu_correo@gmail.com"
  # Para Gmail: usa una "contraseña de aplicación", no tu contraseña normal.
  # Genérala en: https://myaccount.google.com/apppasswords
  password: "TU_CONTRASENA_DE_APLICACION"

  # A dónde enviar el resumen matutino (puede ser el mismo correo)
  digest_recipient: "tu_correo@gmail.com"

# ------------------------------------------------------------
# ORGANIZADOR DE CORREO
# Clasifica correos entrantes en carpetas según reglas.
# Se evalúan en orden; la primera regla que coincide gana.
# ------------------------------------------------------------
email_organizer:
  enabled: true
  source_folder: "INBOX"
  only_unread: true
  rules:
    - name: "Facturas"
      folder: "Facturas"
      match_any:
        subject_contains: ["factura", "invoice", "recibo"]
    - name: "Newsletters"
      folder: "Newsletters"
      match_any:
        sender_contains: ["newsletter", "noreply", "no-reply"]
    - name: "Bohemme"
      folder: "Bohemme"
      match_any:
        sender_contains: ["bohemme.com"]
    - name: "Ofertas"
      folder: "Ofertas"
      match_any:
        subject_contains: ["oferta", "descuento", "% off", "black friday", "rebajas"]

# ------------------------------------------------------------
# DESCARGA DE ARCHIVOS
# Descarga adjuntos de correos que cumplan ciertas condiciones.
# ------------------------------------------------------------
file_downloader:
  enabled: true
  source_folder: "INBOX"
  only_unread: true
  download_path: "./downloads"
  allowed_extensions: [".pdf", ".xlsx", ".docx", ".zip", ".csv"]
  # Solo descarga adjuntos de correos cuyo asunto o remitente contenga
  # alguna de estas palabras (deja vacío [] para descargar de todos)
  filter_subject_contains: []
  filter_sender_contains: []

# ------------------------------------------------------------
# RESUMEN MATUTINO DE NOTICIAS / OFERTAS
# Lee feeds RSS y arma un digest en HTML.
# ------------------------------------------------------------
news_digest:
  enabled: true
  max_items_per_feed: 5
  hours_lookback: 24
  feeds:
    - name: "Marketing Directo"
      url: "https://www.marketingdirecto.com/feed"
      category: "marketing"
    - name: "Xataka (Tech/Ofertas)"
      url: "https://www.xataka.com/tag/ofertas/feed"
      category: "ofertas"
    - name: "El País Economía"
      url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/economia/portada"
      category: "noticias"
  # Palabras clave para resaltar (aparecerán marcadas en el resumen)
  highlight_keywords: ["ecommerce", "joyería", "marketing digital", "IA", "inteligencia artificial"]

# ------------------------------------------------------------
# PROGRAMACIÓN
# A qué hora se ejecuta el bot cada día (formato 24h)
# ------------------------------------------------------------
schedule:
  run_time: "08:00"
  timezone: "Europe/Madrid"
